  /v1/script/create_nearby_planet:
    post:
      tags:
        - Scripts (dev)
      summary: '[SCRIPT] Create nearby planets for all hexes'
      description: >-
        Iterates all hex IDs (0 → 50,000) and generates exploration planets. Run ONCE per universe. Not for production.


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security: []
      responses:
        '200':
          description: Success — created
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: created
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: created
                data:
                  created: 50000
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example: {}
