components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token. Use the token returned by the connect/login endpoints.
  responses:
    BadRequest400:
      description: Validation error — one or more required fields are missing or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 400
              status:
                type: boolean
                example: false
              message:
                type: string
                example: validation error
              error:
                type: string
                description: Comma-separated validation messages (sometimes an array of errors)
                example: WalletAddress is required, amount must be a positive number
          examples:
            yupValidation:
              summary: Yup validation failure
              value:
                statusCode: 400
                status: false
                message: validation error
                error: nearByPlanetId is required, missiontype is required
            plainMissingField:
              summary: Missing required field (controller check)
              value:
                statusCode: 400
                status: false
                message: walletAddress, tokenName, amount and transactionHash are required
    Unauthorized401:
      description: 'Authentication failed — missing, expired or invalid JWT in `Authorization: Bearer <token>`.'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              message:
                type: string
                example: please authenticate
          example:
            status: false
            message: please authenticate
    Forbidden403:
      description: Forbidden — endpoint is restricted (dev-only route called in production, or insufficient role).
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Access restricted to production environment only
          example:
            error: Access restricted to production environment only
    NotFound404:
      description: Resource not found (user, NFT, pool, mission stat, etc.).
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              message:
                type: string
                example: user not found
          example:
            status: false
            message: user not found
    Conflict409:
      description: Conflict — duplicate entry or business-rule violation (e.g. display name already exists, token already listed).
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 409
              status:
                type: boolean
                example: false
              message:
                type: string
                example: displayname already exist
          example:
            statusCode: 409
            status: false
            message: displayname already exist
    Gone410:
      description: Gone — the endpoint has been removed.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: true
              message:
                type: string
                example: no more
          example:
            status: true
            message: no more
    Unprocessable422:
      description: Unprocessable entity — semantic validation failure (e.g. wallet address does not match, missionStatsId missing).
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 422
              status:
                type: boolean
                example: false
              message:
                type: string
                example: Please give valid address
          example:
            statusCode: 422
            status: false
            message: Please give valid address
    Conflict209:
      description: Conflict (custom status) — category/subcategory already exists.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              message:
                type: string
                example: category already exist
          example:
            status: false
            message: category already exist
    ServerError500:
      description: Internal server error — unhandled exception, blockchain/RPC failure, DB error.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              message:
                type: string
                example: Something went wrong
          example:
            status: false
            message: Something went wrong
