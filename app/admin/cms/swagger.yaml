        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: FAQ _id
                question:
                  type: string
                  description: Question text
                answer:
                  type: string
                  description: Answer text
              required:
