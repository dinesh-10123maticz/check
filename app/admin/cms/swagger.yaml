      responses:
        '200':
          description: Success — success
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: success
                  data:
                    description: Response payload
              example:
                status: true
                message: success
                data:
                  _id: 66a...
        '400':
