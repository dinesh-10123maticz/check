          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Admin email
                  example: admin@galfi.com
              required:
                - email
            example:
              email: admin@galfi.com
    put:
      tags:
        - Admin
      summary: Reset admin password with OTP
      description: >-
        **Encrypted payload**: the request body (or `?data=` query param) must be `{"data": "<base64(AES-encrypted
        JSON)>"}`. Responses from this endpoint may also be AES-encrypted (base64 string); examples below are shown
        decrypted for readability.


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security: []
      responses:
        '200':
          description: Success — password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: password updated
                  data:
                    description: Response payload
              example:
                status: true
                message: password updated
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Admin email
                otp:
                  type: string
                  description: OTP received by email
                newPassword:
                  type: string
                  description: New password
                confirmNewPassword:
                  type: string
                  description: Must match newPassword
              required:
                - email
                - otp
                - newPassword
                - confirmNewPassword
            example:
              email: admin@galfi.com
              otp: '123456'
              newPassword: newsecret
              confirmNewPassword: newsecret
