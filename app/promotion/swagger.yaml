          in: path
          required: true
          description: News _id
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Success — fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: fetched
                  data:
                    description: Response payload
              example:
