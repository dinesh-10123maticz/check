openapi: 3.0.3
info:
  title: GALFI Exchange API
  version: 1.0.0
  description: >-
    Complete API documentation for the **GALFI** backend (game NFT marketplace) — automatically generated from the
    actual Express routes, controllers and yup validation schemas.


    ## Base URL

    All endpoints are mounted under **`/v1`** (e.g. `POST /v1/user/connect`).


    ## Authentication

    Most endpoints require `Authorization: Bearer <JWT>` in the request header.


    | Token | Where it comes from | Used by |

    |---|---|---|

    | User JWT | `POST /v1/user/connect` · `POST /v1/user/create` · `POST /v1/user/gameconnect` | User & Game endpoints
    |

    | Admin JWT | `POST /v1/admin/adminlogin` | Admin/CMS endpoints |


    ## Payload encryption

    Several endpoints run through `DecryptDatas` / `decryptGameRequest` middleware:


    - `DecryptDatas` — the request body must be `{"data": "<base64(AES-encrypted JSON)>"}` (or the same value in the
    `data` query parameter).

    - `decryptGameRequest` — the request body must be `{"token": "<base64(AES-encrypted JSON)>"}`.

    - Some of these endpoints also **encrypt their responses** (the raw HTTP body is a base64 AES string). Examples in
    this spec are shown **decrypted** for readability.


    ## Response envelope

    Two envelope styles are used:


    ```json

    // sendRes style (plain)

    { "statusCode": 200, "status": true, "message": "fetched", "data": { } }

    // sendResponse style (may be AES-encrypted at transport level)

    { "status": true, "message": "fetched", "data": { } }

    ```


    Validation failures return `400` (or `409` on some NFT/promo routes) with an `error` field listing the failed
    fields.


    This standalone file documents the **Exchange** module.
servers:
  - url: /
    description: Current API host
tags:
  - name: Exchange
paths:
  /v1/exchange/stack:
    post:
      tags:
        - Exchange
      summary: Stake tokens into a pool (game engine)
      description: >-
        Requires **user JWT**: `Authorization: Bearer <token>` (from /user/gameconnect).


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — staked
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: staked
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: staked
                data:
                  _id: 66b...
                  poolId: 66a...
                  amount: 100
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                poolId:
                  type: string
                  description: Token pool _id
                amount:
                  type: number
                  description: Amount to stake (must be positive)
                  example: 100
              required:
                - poolId
                - amount
            example:
              poolId: 66a...
              amount: 100
  /v1/exchange/stacktoken:
    post:
      tags:
        - Exchange
      summary: Stake tokens into a pool (validated)
      description: >-
        Yup validation: `poolId` (required string), `amount` (required positive number).


        Requires **user JWT**: `Authorization: Bearer <token>` (from /user/gameconnect).


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — staked
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: staked
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: staked
                data:
                  _id: 66b...
                  poolId: 66a...
                  amount: 100
                  claimed: false
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                poolId:
                  type: string
                  description: Token pool _id
                amount:
                  type: number
                  description: Amount to stake (must be positive)
                  example: 100
              required:
                - poolId
                - amount
            example:
              poolId: 66a...
              amount: 100
  /v1/exchange/tokenpoollist:
    get:
      tags:
        - Exchange
      summary: Get active token pools (public)
      description: >-
        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security: []
      responses:
        '200':
          description: Success — fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: fetched
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: fetched
                data:
                  - _id: 66a...
                    name: GALFI 30d
                    lockedPeriod: 30
                    rewardPercent: 10
                    isActive: true
        '500':
          $ref: '#/components/responses/ServerError500'
  /v1/exchange/admin/tokenpoollist:
    get:
      tags:
        - Exchange
      summary: Get all token pools incl. inactive (admin)
      description: >-
        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security: []
      responses:
        '200':
          description: Success — fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: fetched
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: fetched
                data:
                  - _id: 66a...
                    name: GALFI 30d
                    lockedPeriod: 30
                    rewardPercent: 10
                    isActive: false
        '500':
          $ref: '#/components/responses/ServerError500'
  /v1/exchange/admin/tokenpoolstatus:
    post:
      tags:
        - Exchange
      summary: Toggle token pool visibility
      description: >-
        Requires **admin JWT**: `Authorization: Bearer <token>` (from /admin/adminlogin).


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — change to visible/hidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: change to visible/hidden
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: change to visible
                data:
                  _id: 66a...
                  isActive: true
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  description: Token pool _id
              required:
                - _id
            example:
              _id: 66a...
  /v1/exchange/admin/createtokenpool:
    post:
      tags:
        - Exchange
      summary: Create a token pool (admin)
      description: >-
        Yup validation: `name`, `lockedPeriod`, `rewardPercent`, `stakeCurrencyId`, `rewardCurrencyId` are required.


        Requires **admin JWT**: `Authorization: Bearer <token>` (from /admin/adminlogin).


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Success — created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: created successfully
                  data:
                    description: Response payload
              example:
                statusCode: 201
                status: true
                message: created successfully
                data:
                  _id: 66a...
                  name: GALFI 30d
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imageUrl:
                  type: string
                  description: Pool image URL (optional)
                name:
                  type: string
                  description: Pool name
                  example: GALFI 30d
                lockedPeriod:
                  type: integer
                  description: Lock period in days (positive)
                  example: 30
                rewardPercent:
                  type: number
                  description: Reward percentage (positive)
                  example: 10
                stakeCurrencyId:
                  type: string
                  description: Currency _id users stake
                  example: 664a...
                rewardCurrencyId:
                  type: string
                  description: Currency _id users earn
                  example: 664a...
              required:
                - name
                - lockedPeriod
                - rewardPercent
                - stakeCurrencyId
                - rewardCurrencyId
            example:
              name: GALFI 30d
              lockedPeriod: 30
              rewardPercent: 10
              stakeCurrencyId: 664a...
              rewardCurrencyId: 664a...
  /v1/exchange/admin/updatetokenpool:
    post:
      tags:
        - Exchange
      summary: Update a token pool (admin)
      description: >-
        Yup validation: `_id` is required. The updatable fields live inside a nested `payload` object.


        Requires **admin JWT**: `Authorization: Bearer <token>` (from /admin/adminlogin).


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: updated successfully
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: updated successfully
                data:
                  _id: 66a...
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  description: Token pool _id
                payload:
                  type: object
                  description: Fields to update
                  example:
                    imageUrl: '...'
                    name: GALFI 60d
                    rewardPercent: 12
                    lockedPeriod: 60
                    stakeCurrencyId: 664a...
                    rewardCurrencyId: 664a...
              required:
                - _id
            example:
              _id: 66a...
              payload:
                name: GALFI 60d
                lockedPeriod: 60
                rewardPercent: 12
  /v1/exchange/claimstackedtoken:
    post:
      tags:
        - Exchange
      summary: Claim a staked position
      description: >-
        Requires **user JWT**: `Authorization: Bearer <token>` (from /user/gameconnect).


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: claimed
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: claimed
                data:
                  _id: 66b...
                  claimed: true
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenStakeId:
                  type: string
                  description: Token stake _id
              required:
                - tokenStakeId
            example:
              tokenStakeId: 66b...
  /v1/exchange/stakedtokendetails:
    get:
      tags:
        - Exchange
      summary: Get stacked (staked) token details for the user
      description: >-
        Requires **user JWT**: `Authorization: Bearer <token>` (from /user/gameconnect).


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — fetched stacked details
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: fetched stacked details
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: fetched stacked details
                data:
                  active:
                    - _id: 66b...
                      amount: 100
                      claimable: 110
                  claimed: []
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
  /v1/exchange/getclaim:
    post:
      tags:
        - Exchange
      summary: Get claimable balance from a pool
      description: >-
        `accoundAddress` must match the authenticated user wallet, otherwise 422. Payload is AES-encrypted in `token`.


        Requires **user JWT**: `Authorization: Bearer <token>` (from /user/gameconnect).


        **Encrypted payload**: the request body must be `{"token": "<base64(AES-encrypted JSON)>"}` where the encrypted
        JSON holds the fields documented below.


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: fetched
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: fetched
                data:
                  claimable: '100'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '422':
          $ref: '#/components/responses/Unprocessable422'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  description: Amount
                tokenAddress:
                  type: string
                  description: Token contract address
                accoundAddress:
                  type: string
                  description: Account wallet (must equal JWT user wallet)
                contractAddress:
                  type: string
                  description: Pool/reward contract address
                network:
                  type: string
                  description: Network
                  example: polygon
              required:
                - amount
                - tokenAddress
                - accoundAddress
                - contractAddress
                - network
            example:
              amount: '100'
              tokenAddress: 0x...
              accoundAddress: 0x1a...
              contractAddress: 0x...
              network: polygon
  /v1/exchange/withdraw:
    post:
      tags:
        - Exchange
      summary: Withdraw balance (game engine, encrypted)
      description: >-
        Requires `tokenName`, `amount` and `transactionHash` — otherwise 400 `invalid data`. Response is encrypted.


        Requires **user JWT**: `Authorization: Bearer <token>` (from /user/gameconnect).


        **Encrypted payload**: the request body must be `{"token": "<base64(AES-encrypted JSON)>"}` where the encrypted
        JSON holds the fields documented below.


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: withdrawn
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: withdrawn
                data:
                  balance: 1200
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenName:
                  type: string
                  description: Token symbol
                  example: GALFI
                amount:
                  type: string
                  description: Amount to withdraw
                transactionHash:
                  type: string
                  description: Withdrawal transaction hash
              required:
                - tokenName
                - amount
                - transactionHash
            example:
              tokenName: GALFI
              amount: '50'
              transactionHash: 0xabc...
  /v1/exchange/admin/transcation:
    get:
      tags:
        - Exchange
      summary: Get transactions (admin)
      description: >-
        Route currently binds to the withdraw controller; documented here as the transaction listing endpoint.


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      parameters:
        - name: page
          in: query
          required: false
          description: ''
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          description: ''
          schema:
            type: integer
            example: 10
      security: []
      responses:
        '200':
          description: Success — fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: fetched
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: fetched
                data:
                  - _id: 66c...
                    walletAddress: 0x1a...
                    action: deposite
                    token: 100
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/ServerError500'
  /v1/exchange/convert/price:
    post:
      tags:
        - Exchange
      summary: Convert USD to asset price
      description: >-
        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security: []
      responses:
        '200':
          description: Success — converted
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: converted
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: converted
                data:
                  usd: 100
                  assetType: planet
                  price: 1250.5
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usd:
                  type: number
                  description: USD amount
                  example: 100
                assetType:
                  type: string
                  description: Asset type
                  example: planet
              required:
                - usd
                - assetType
            example:
              usd: 100
              assetType: planet
  /v1/exchange/dev/updatemoney:
    post:
      tags:
        - Exchange
      summary: '[DEV] Update user balance directly'
      description: >-
        Development-only endpoint to top-up/alter a user balance.


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security: []
      responses:
        '200':
          description: Success — updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: updated
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: updated
                data:
                  balance: 1000
        '400':
          $ref: '#/components/responses/BadRequest400'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletAddress:
                  type: string
                  description: Wallet address
                balance:
                  type: number
                  description: New balance
                stacked:
                  type: number
                  description: New stacked balance
                label:
                  type: string
                  description: Currency symbol
                  example: GALFI
              required:
                - walletAddress
            example:
              walletAddress: 0x1a...
              balance: 1000
              label: GALFI
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token. Use the token returned by the connect/login endpoints.
  responses:
    BadRequest400:
      description: Validation error — one or more required fields are missing or invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 400
              status:
                type: boolean
                example: false
              message:
                type: string
                example: validation error
              error:
                type: string
                description: Comma-separated validation messages (sometimes an array of errors)
                example: WalletAddress is required, amount must be a positive number
          examples:
            yupValidation:
              summary: Yup validation failure
              value:
                statusCode: 400
                status: false
                message: validation error
                error: nearByPlanetId is required, missiontype is required
            plainMissingField:
              summary: Missing required field (controller check)
              value:
                statusCode: 400
                status: false
                message: walletAddress, tokenName, amount and transactionHash are required
    Unauthorized401:
      description: 'Authentication failed — missing, expired or invalid JWT in `Authorization: Bearer <token>`.'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              message:
                type: string
                example: please authenticate
          example:
            status: false
            message: please authenticate
    Forbidden403:
