            example:
              WalletAddress: 0x1a...
              Cover: user/0x.../cover/1712345678901.png
  /v1/user/getbalance:
    get:
      tags:
        - User
      summary: Get on-chain + off-chain token balances
      description: >-
        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      parameters:
        - name: walletAddress
          in: query
          required: true
          description: Wallet address
          schema:
            type: string
            example: 0x1a...
        - name: network
          in: query
          required: false
          description: Blockchain network (e.g. polygon)
          schema:
            type: string
            example: polygon
      security: []
      responses:
        '200':
          description: Success — fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: fetched
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: fetched
                data:
                  - label: GALFI
                    balance: 1250.5
                    stacked: 100
                    contractAddress: 0x...
                    network: polygon
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/ServerError500'
  /v1/user/addbalance:
    post:
      tags:
        - User
      summary: Add balance to a user currency (admin/dev helper)
      description: >-
        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security: []
      responses:
        '200':
          description: Success — Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
