        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security: []
      responses:
        '200':
          description: Success — Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Success
                  data:
                    description: Response payload
              example:
                status: true
                message: Success
                data:
                  _id: 665f1a...
                  NFTName: 'Galaxy #1001'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '409':
          $ref: '#/components/responses/Conflict409'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CollectionNetwork:
                  type: string
                  description: Network the collection lives on
                  example: polygon
                CollectionName:
                  type: string
                  description: Collection name
                  example: Galaxy Planets
                CollectionSymbol:
                  type: string
                  description: Collection symbol
                  example: GALAXY
                NFTId:
                  type: string
                  description: On-chain NFT token id
                  example: '1001'
                NFTName:
                  type: string
                  description: NFT name
                  example: 'Galaxy #1001'
                Category:
                  type: string
                  description: Category name
                  example: planet
                NFTDescription:
                  type: string
                  description: Description
                  example: Rare desert planet
                NFTOrginalImage:
                  type: string
                  description: Original image key/URL
                NFTThumpImage:
                  type: string
                  description: Thumbnail image key/URL
                UnlockContent:
                  type: string
                  description: Unlockable content
                ContractAddress:
                  type: string
                  description: Collection contract address
                  example: 0x...
                ContractType:
                  type: string
                  description: Contract type
                  example: planet
                NFTRoyalty:
                  type: number
                  description: Royalty percentage
                  example: 5
                NFTProperties:
                  type: array
                  items: {}
                  description: Trait properties
                  example:
                    - trait: Rarity
                      value: Rare
                CompressedFile:
                  type: string
                  description: Compressed file key
                CompressedThumbFile:
                  type: string
                  description: Compressed thumbnail key
                NFTOrginalImageIpfs:
                  type: string
                  description: IPFS URL of original image
                NFTThumpImageIpfs:
                  type: string
                  description: IPFS URL of thumbnail
                MetaData:
                  type: object
                  description: Metadata object
                MetFile:
                  type: string
                  description: Metadata file key
                NFTCreator:
                  type: string
                  description: Creator wallet address
                NFTQuantity:
                  type: integer
                  description: Quantity
                  example: 1
                PutOnSale:
                  type: boolean
                  description: Whether listed for sale
                  example: true
                PutOnSaleType:
                  type: string
                  description: Sale type (fixed/auction)
                  example: fixed
                NFTPrice:
                  type: number
                  description: Sale price
                  example: 100
                CoinName:
                  type: string
                  description: Pricing token symbol
                  example: GALFI
                ClockTime:
                  type: integer
                  description: Start time (ms)
                EndClockTime:
                  type: integer
                  description: End time (ms)
                HashValue:
                  type: string
                  description: Transaction hash
                NFTOwner:
                  type: string
                  description: Owner wallet address
                activity:
                  type: array
                  items: {}
                  description: Activity log entries
                NFTBalance:
                  type: number
                  description: Owner balance
                  example: 1
                LazyStatus:
                  type: boolean
                  description: Lazy mint flag
                NonceHash:
                  type: string
                  description: Nonce hash
                RandomName:
                  type: string
                  description: Random name
                SignatureHash:
                  type: string
                  description: Signature hash
              required:
                - NFTName
                - CollectionNetwork
                - ContractAddress
                - ContractType
                - NFTOwner
            example:
              NFTName: 'Galaxy #1001'
              CollectionNetwork: polygon
              ContractAddress: 0x...
              ContractType: planet
              NFTOwner: 0x1a...
              NFTPrice: 100
              CoinName: GALFI
              NFTQuantity: 1
              NFTOrginalImage: nft/original/1001.png
              NFTThumpImage: nft/thumb/1001.png
