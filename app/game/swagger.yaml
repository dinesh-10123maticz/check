        success examples is illustrative — actual payloads depend on the resource.
      parameters:
        - name: type
          in: query
          required: false
          description: planet | asteroid
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: ''
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          description: ''
          schema:
            type: integer
            example: 10
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: fetched
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: fetched
                data:
                  - _id: 66e...
                    name: Earth
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
  /v1/game/ipfs/planet:
    post:
      tags:
        - Game
      summary: Mint planet metadata to IPFS (v2)
      description: >-
        Strict yup validation (no unknown fields): planetId, WalletAddress, priceType (coin|token), symbol when
        priceType=token.


        Requires **game JWT**: `Authorization: Bearer <token>` issued by the game engine.


        **Success & error responses:** every endpoint documents the success response with an example, plus the
        validation error (400/409), authentication error (401), and internal server error (500) shapes. `data` in
        success examples is illustrative — actual payloads depend on the resource.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success — minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: minted
                  data:
                    description: Response payload
              example:
                statusCode: 200
                status: true
                message: minted
                data:
                  ipfs: ipfs://...
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '500':
          $ref: '#/components/responses/ServerError500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planetId:
                  type: string
                  description: Planet _id (required)
                WalletAddress:
                  type: string
                  description: Wallet address (required, must match ^0x[a-f0-9]{40}$)
                priceType:
                  type: string
                  description: coin | token (required)
                  enum:
                    - coin
                    - token
                  example: coin
                symbol:
                  type: string
                  description: Token symbol (required when priceType=token; must match ^[A-Z0-9]{2,10}$)
                  example: GALFI
              required:
                - planetId
                - WalletAddress
                - priceType
            example:
              planetId: 66e...
              WalletAddress: '0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b'
              priceType: coin
