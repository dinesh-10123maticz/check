<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GALFI Backend API — Swagger Docs</title>
  <link rel="stylesheet" href="swagger-ui.css">
  <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
  <style>
    html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 0 20px; background: #1b1b1f; color: #fff; height: 56px; }
    .topbar img { height: 28px; }
    .topbar .title { font-size: 16px; font-weight: 600; }
    .topbar .sub { font-size: 12px; color: #b9b9c3; }
    .topbar .badge { margin-left: auto; background: #2f5b3a; color: #b7f7c5; font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="favicon-32x32.png" alt="GALFI" />
    <div>
      <span class="title">GALFI Backend API</span>
      <span class="sub">&nbsp;·&nbsp;Swagger UI (OpenAPI 3.0.3)</span>
    </div>
    <span class="badge">257 endpoints</span>
  </div>
  <div id="swagger-ui"></div>
  <script src="swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: 'openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: 'StandaloneLayout',
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        displayRequestDuration: true,
        filter: true,
        tryItOutEnabled: false
      });
    };
  </script>
</body>
</html>
